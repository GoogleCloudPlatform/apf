[tools]
go = "1.26.1"
air = "latest"

[env]
FIRESTORE_EMULATOR_HOST = "localhost:8084"
FIREBASE_AUTH_EMULATOR_HOST = "localhost:8085"

[tasks.dev]
description = "Run Go API backend locally with hot reload (air)"
run = "air"

[tasks.run]
description = "Run Go API backend directly"
run = "go run ."

[tasks.lint]
description = "Run Go linter for API service"
run = "golangci-lint run"

[tasks.test]
description = "Run Go unit tests for API service"
run = "go test ./..."
