root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
cmd = "go build -gcflags=\"all=-N -l\" -o ./tmp/ai ."
bin = "./tmp/ai"
full_bin = "dlv --listen=:2346 --headless=true --api-version=2 --continue --accept-multiclient exec ./tmp/ai web --port 8080 api webui"
include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
exclude_dir = ["assets", "tmp", "vendor", "testdata"]
delay = 1000

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[log]
time = false
