[tools]
go = "1.26.1"
air = "latest"

[tasks.dev]
description = "Run Go AI backend locally with hot reload (air)"
run = "air"

[tasks.run]
description = "Run Go AI backend directly (matches VSCode 'Ai' launch config)"
run = "go run . web --port 8080 -read-timeout 5m -write-timeout 5m api webui"

[tasks.lint]
description = "Run Go linter for AI service"
run = "golangci-lint run"

[tasks.test]
description = "Run Go unit tests for AI service"
run = "go test ./..."
