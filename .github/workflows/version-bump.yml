name: Label-Based Version Bump

on:
  pull_request:
    types: [closed]
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # Required to read PR labels
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate and Increment Version
        id: version_logic
        env:
          # Extract labels as a space-separated string
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          # 1. Get current version
          VERSION=$(jq -r '.version' version.json)
          IFS='.' read -r major minor patch <<< "$VERSION"
          echo "Current: $major.$minor.$patch"

          # 2. Determine bump type based on labels
          if [[ " $PR_LABELS " =~ " major " ]]; then
            NEW_VERSION="$((major + 1)).0.0"
          elif [[ " $PR_LABELS " =~ " minor " ]]; then
            NEW_VERSION="$major.$((minor + 1)).0"
          else
            # Default to patch if 'patch' label exists or no labels are present
            NEW_VERSION="$major.$minor.$((patch + 1))"
          fi

          echo "New Version: $NEW_VERSION"
          
          # 3. Update file and export
          echo "{\"version\": \"$NEW_VERSION\"}" > version.json
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add version.json
          git commit -m "chore: release v${{ steps.version_logic.outputs.NEW_VERSION }}"
          
          git tag -a v${{ steps.version_logic.outputs.NEW_VERSION }} -m "Release v${{ steps.version_logic.outputs.NEW_VERSION }}"
          git push origin main --follow-tags
