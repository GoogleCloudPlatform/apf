name: API Tests & Code Coverage

on:
  push:
    branches: [ main, master, feature/** ]
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Go Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
          cache-dependency-path: 'api/go.sum'

      - name: Run Tests with Race Detector & Coverage
        working-directory: api
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out > coverage.txt
          go tool cover -html=coverage.out -o coverage.html

      - name: Publish Coverage Summary to GitHub
        working-directory: api
        run: |
          TOTAL_COVERAGE=$(tail -n 1 coverage.txt | awk '{print $NF}')
          echo "## 🧪 Go API Test Coverage: **$TOTAL_COVERAGE**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to view detailed function coverage</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-code-coverage
          path: |
            api/coverage.out
            api/coverage.txt
            api/coverage.html

      - name: Upload Coverage to Codecov (Optional)
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: api/coverage.out
          flags: api
          name: apf-api-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
