# GitHub Actions CI/CD Pipeline for Agentic Foundry
# Generated by BMad TEA Agent - Test Architect Module
# Stack: Fullstack (Go Backend + Next.js Playwright Frontend)

name: Test & Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly burn-in on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Backend Go Tests
  # ============================================================================
  backend-test:
    name: Backend Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
          cache: true

      - name: Run Go unit & integration tests
        run: cd api && go test -v -race ./...

  # ============================================================================
  # Stage 2: Frontend E2E Tests (Playwright Sharded)
  # ============================================================================
  frontend-e2e:
    name: Frontend E2E (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-test

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Frontend Dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (Shard ${{ matrix.shard }}/4)
        working-directory: ui
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Test Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 30

  # ============================================================================
  # Stage 3: Flaky Test Burn-In Loop
  # ============================================================================
  burn-in:
    name: Burn-In Flaky Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-e2e
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Frontend Dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run Burn-In Loop (5 Iterations)
        working-directory: ui
        run: |
          echo "🔥 Starting 5-iteration burn-in loop for flaky test detection..."
          for i in {1..5}; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in Iteration $i/5"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            npm run test:e2e || exit 1
          done
          echo "✅ Burn-in complete - zero flaky tests detected!"

      - name: Upload Burn-In Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failure-artifacts
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 30

  # ============================================================================
  # Stage 4: Quality Gate Summary & Reporting
  # ============================================================================
  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-e2e, burn-in]
    if: always()

    steps:
      - name: Generate Summary Report
        run: |
          echo "## 🧪 TEA Quality Gate Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Go Tests**: ${{ needs.backend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend E2E Tests**: ${{ needs.frontend-e2e.result }} (4 Shards)" >> $GITHUB_STEP_SUMMARY
          echo "- **Burn-In Flaky Check**: ${{ needs.burn-in.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-test.result }}" == "success" ] && [ "${{ needs.frontend-e2e.result }}" == "success" ]; then
            echo "🟢 **PASSED:** Quality Gate cleared! All P0/P1 criteria passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "🔴 **FAILED:** Quality Gate blocked. Check test artifacts." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
