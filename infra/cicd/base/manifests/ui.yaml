apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: placeholder-ui # from-param: ${prefix}-ui
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/network-interfaces: placeholder-network-interfaces # from-param: ${network_interfaces}
        run.googleapis.com/vpc-access-egress: all-traffic
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: placeholder-service-account # from-param: ${service_account}
      containers:
        - image: apf-ui
          ports:
            - containerPort: 8080
          env:
            - name: API_BACKEND
              value: placeholder-url # from-param: ${api_backend}
