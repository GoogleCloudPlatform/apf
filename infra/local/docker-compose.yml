services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: apf-local-session-db-image
    container_name: apf-local-session-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=apf-local-session-db
      - POSTGRES_USER=apf-local-adk-user
      - POSTGRES_PASSWORD=apf-local-adk-password
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apf-local-pgadmin
    ports:
      - "8083:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:
